name: Reporte de error
description: Informa un comportamiento reproducible de la aplicación.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: No incluyas claves API, datos personales ni archivos con copyright.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: ¿Qué ocurrió y qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre…
        2. Selecciona…
        3. Observa…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versión de macOS
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Capturas, logs redactados u otra información útil.
