name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          xcodebuild test \
            -project GuitarPracticeLab.xcodeproj \
            -scheme GuitarPracticeLab-Mac \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/GuitarPracticeLab-DerivedData" \
            CODE_SIGNING_ALLOWED=NO
